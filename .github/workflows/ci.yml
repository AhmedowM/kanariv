name: CI

"on":
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build (${{ matrix.os }} / ${{ matrix.compiler }})
    runs-on: ${{ matrix.os }}
    env:
      KANARIV_TEST_NOAUDIO: 1
    strategy:
      fail-fast: false
      matrix:
        # NOTE: ubuntu-latest is 24.04 today but migrates to 26.04 in Nov 2026
        # (new kernel/CMake/FFmpeg, PPA gcc-16 support TBD) -- re-validate then.
        # Compiler lives in the matrix (`toolchain`); `compiler` below is
        # display + artifact naming only. macOS is LLVM Clang --
        # GCC builds miniaudio with the dummy backend (no audio).
        os: [ubuntu-latest, macos-latest, windows-latest]
        include:
          - os: ubuntu-latest
            compiler: gcc-16
            toolchain: gcc
          - os: macos-latest
            compiler: clang
            toolchain: clang
          - os: windows-latest
            compiler: msvc
            toolchain: msvc
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check VERSION matches latest tag
        run: |
          tag="$(git describe --tags --abbrev=0 2>/dev/null | tr -d v)" || { echo "no tags in clone -- skipping VERSION check"; exit 0; }
          ver="$(tr -d 'v \n\r' < VERSION)"
          test "$ver" = "$tag" || (echo "VERSION file ($ver) drifted from latest tag ($tag) -- bump VERSION in the release-prep commit" && exit 1)
        shell: bash

      - name: Setup GCC (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo add-apt-repository ppa:ubuntu-toolchain-r/test -y
          sudo apt-get update
          sudo apt-get install -y gcc-16 g++-16
          sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-16 100 --slave /usr/bin/g++ g++ /usr/bin/g++-16 --slave /usr/bin/gcov gcov /usr/bin/gcov-16 || true
          gcc-16 --version
          g++-16 --version
          # also make gcc/g++ point to 16 for tools that call plain gcc
          sudo update-alternatives --set gcc /usr/bin/gcc-16 || true
          gcc --version; g++ --version

      - name: Setup LLVM Clang (macOS)
        if: runner.os == 'macOS'
        run: |
          # Policy: LLVM Clang only on Apple (brew `llvm` is keg-only, so it
          # never shadows system clang -- the toolchain resolves
          # "$(brew --prefix llvm)/bin/clang" explicitly). GCC builds
          # miniaudio with the dummy backend (no audio); AppleClang lags
          # our C++23 baseline. Both are fatal at configure time.
          brew update || echo "brew update failed, continuing with snapshot"
          brew install llvm || brew upgrade llvm
          LLVM_PREFIX="$(brew --prefix llvm)"
          echo "$LLVM_PREFIX/bin" >> $GITHUB_PATH
          "$LLVM_PREFIX/bin/clang" --version
          "$LLVM_PREFIX/bin/clang++" --version
          LLVM_MAJOR="$("$LLVM_PREFIX/bin/clang" -dumpversion | cut -d. -f1)"
          test "$LLVM_MAJOR" -ge 20 || (echo "brew LLVM too old for our C++23 baseline (<expected>, <print>): $LLVM_MAJOR" && exit 1)

      - name: Install dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build ffmpeg libavcodec-dev libavformat-dev libavutil-dev libswresample-dev libswscale-dev graphviz patchelf libdbus-1-dev libglib2.0-bin pkg-config dbus-x11
          ffmpeg -version || true
          cmake --version
          ninja --version

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          # ninja + ffmpeg only: graphviz (Doxygen dot) is unused in CI and
          # its bottle (svn dependency) is slow and flaky.
          brew install ninja ffmpeg || brew upgrade ninja ffmpeg || true
          ffmpeg -version || true
          cmake --version
          ninja --version

      - name: Install dependencies (Windows)
        if: runner.os == 'Windows'
        run: |
          choco install ninja -y --no-progress || echo "ninja choco install failed"
          # FFmpeg via system or SetupFFmpeg fallback -- no hard fail if not found, but tests need it
          # Try choco ffmpeg as best-effort; fallback downloads prebuilt if needed
          choco install ffmpeg -y --no-progress || echo "ffmpeg choco install failed, will download prebuilt"
          cmake --version
          ninja --version
          ffmpeg -version || echo "ffmpeg not on PATH, will download prebuilt"

      - name: Download FFmpeg (Windows MSVC fallback)
        if: runner.os == 'Windows' && matrix.toolchain == 'msvc'
        shell: pwsh
        run: |
          python scripts/download-ffmpeg.py
          $root = python scripts/download-ffmpeg.py --print-root
          echo "FFmpeg_ROOT=$root" >> $env:GITHUB_ENV
          echo "$root/bin" >> $env:GITHUB_PATH

      - name: Configure
        run: |
          python scripts/configure.py ci --toolchain ${{ matrix.toolchain }} --build-dir build/ci-${{ matrix.toolchain }} --print
          python scripts/configure.py ci --toolchain ${{ matrix.toolchain }} --build-dir build/ci-${{ matrix.toolchain }} --ffmpeg-root $env:FFmpeg_ROOT

      - name: Expose DLLs (Windows)
        if: runner.os == 'Windows'
        run: |
          # Test executables run at build time (Catch2 discovery) and test
          # time. The loader needs FFmpeg DLLs AND, for MinGW, the toolchain
          # runtime (libstdc++-6.dll etc.); neither is on PATH by default.
          # 0xc0000135 == STATUS_DLL_NOT_FOUND. (MSVC links the system UCRT.)
          # NOTE: the Windows loader needs ABSOLUTE Windows-style dirs.
          # Relative entries resolve against each process CWD (useless) and
          # Git-Bash POSIX paths (/d/...) are unreadable to it -- always
          # convert with cygpath -w.
          dll=$(find build/ci-${{ matrix.toolchain }}/_deps -name 'avcodec-*.dll' | head -n 1)
          if [ -z "$dll" ]; then
            # System FFmpeg (e.g. choco): DLLs sit next to ffmpeg.exe itself.
            fdir="$(dirname "$(command -v ffmpeg)")"
            dll=$(find "$fdir" -maxdepth 1 -name 'avcodec-*.dll' | head -n 1)
          fi
          test -n "$dll" || (echo "FFmpeg DLLs not found" && exit 1)
          cygpath -w "$(cd "$(dirname "$dll")" && pwd)" >> $GITHUB_PATH
          echo "PATH additions:"; tail -n 2 "$GITHUB_PATH"
        shell: bash

      - name: Build
        run: python scripts/configure.py ci --toolchain ${{ matrix.toolchain }} --build-dir build/ci-${{ matrix.toolchain }} --build

      - name: MPRIS smoke test (Linux)
        if: runner.os == 'Linux'
        run: |
          # Start a session D-Bus so the MPRIS backend can register on it
          # (CI containers do not run a session bus by default).
          eval "$(dbus-launch)"
          export DBUS_SESSION_BUS_ADDRESS

          # Start the daemon, then introspect the MPRIS D-Bus interface to
          # confirm the org.mpris.MediaPlayer2.Player interface and
          # PlaybackStatus property are exported.
          export KANARIV_TEST_NOAUDIO=1
          build/ci-${{ matrix.toolchain }}/kanariv start --foreground &
          DAEMON_PID=$!
          sleep 2
          # Introspect the MPRIS interface
          gdbus introspect --session --dest org.mpris.MediaPlayer2.kanariv --object-path /org/mpris/MediaPlayer2 2>&1 | tee /tmp/mpris-introspect.txt
          test -s /tmp/mpris-introspect.txt || (echo "MPRIS introspection failed" && kill $DAEMON_PID 2>/dev/null || true && kill $DBUS_SESSION_BUS_PID 2>/dev/null || true && exit 1)
          grep -q "org.mpris.MediaPlayer2.Player" /tmp/mpris-introspect.txt || (echo "MPRIS Player interface missing" && kill $DAEMON_PID 2>/dev/null || true && kill $DBUS_SESSION_BUS_PID 2>/dev/null || true && exit 1)
          grep -q "PlaybackStatus" /tmp/mpris-introspect.txt || (echo "MPRIS PlaybackStatus property missing" && kill $DAEMON_PID 2>/dev/null || true && kill $DBUS_SESSION_BUS_PID 2>/dev/null || true && exit 1)
          # Writable volume + Seeked signal are part of the parity work: the
          # backend maps MPRIS Volume to engine volume and emits Seeked after
          # Seek/SetPosition. Query the raw introspection XML so the checks do
          # not depend on gdbus' pretty-printer formatting.
          gdbus introspect --xml --session --dest org.mpris.MediaPlayer2.kanariv --object-path /org/mpris/MediaPlayer2 > /tmp/mpris-introspect.xml 2>&1 || true
          grep -q 'name="Volume" type="d" access="readwrite"' /tmp/mpris-introspect.xml || (echo "MPRIS Volume is not writable" && kill $DAEMON_PID 2>/dev/null || true && kill $DBUS_SESSION_BUS_PID 2>/dev/null || true && exit 1)
          grep -q 'name="Seeked"' /tmp/mpris-introspect.xml || (echo "MPRIS Seeked signal missing" && kill $DAEMON_PID 2>/dev/null || true && kill $DBUS_SESSION_BUS_PID 2>/dev/null || true && exit 1)
          kill $DAEMON_PID 2>/dev/null || true
          kill $DBUS_SESSION_BUS_PID 2>/dev/null || true
        shell: bash

      - name: macOS media-session smoke test
        if: runner.os == 'macOS'
        run: |
          # Verify the MediaPlayer framework is linked into libservice.dylib
          # (the macOS media-session backend links it via service.cmake),
          # then start the daemon briefly to confirm it does not crash with
          # media-session enabled (MPNowPlayingInfoCenter / MPRemoteCommandCenter).
          LIB="build/ci-${{ matrix.toolchain }}/libservice.1.dylib"
          test -f "$LIB" || LIB="build/ci-${{ matrix.toolchain }}/libservice.dylib"
          otool -L "$LIB" | grep -q "MediaPlayer" \
            || (echo "MediaPlayer framework not linked into $LIB" && exit 1)
          # AppKit provides NSImage, used to build MPMediaItemArtwork.
          otool -L "$LIB" | grep -q "AppKit" \
            || (echo "AppKit framework not linked into $LIB" && exit 1)

          BIN="build/ci-${{ matrix.toolchain }}/kanariv"

          export KANARIV_TEST_NOAUDIO=1
          "$BIN" start --foreground &
          DAEMON_PID=$!
          sleep 2
          kill -0 $DAEMON_PID 2>/dev/null \
            || (echo "daemon exited early" && exit 1)
          kill $DAEMON_PID 2>/dev/null || true
        shell: bash

      - name: Test
        env:
          KANARIV_TEST_NOAUDIO: 1
        run: python scripts/configure.py ci --toolchain ${{ matrix.toolchain }} --build-dir build/ci-${{ matrix.toolchain }} --test

      - name: Package (TGZ/ZIP)
        run: |
          # `cmake --build --target package` runs CPack with CWD in the build
          # tree, so the archives land there. Keep package failures fatal so
          # the upload step cannot hide the original CPack diagnostic.
          python scripts/configure.py ci --toolchain ${{ matrix.toolchain }} --build-dir build/ci-${{ matrix.toolchain }} --package
        shell: bash

      - name: Upload artifact - package
        uses: actions/upload-artifact@v4
        with:
          name: kanariv-package-${{ matrix.os }}-${{ matrix.compiler }}
          path: build/ci-${{ matrix.toolchain }}/*.tar.gz
          if-no-files-found: error

  docs:
    name: docs (ubuntu-24.04)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup GCC 16
        run: |
          sudo add-apt-repository ppa:ubuntu-toolchain-r/test -y
          sudo apt-get update
          sudo apt-get install -y gcc-16 g++-16
          sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-16 100 --slave /usr/bin/g++ g++ /usr/bin/g++-16 --slave /usr/bin/gcov gcov /usr/bin/gcov-16 || true
          sudo update-alternatives --set gcc /usr/bin/gcc-16 || true
          gcc --version; g++ --version

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build ffmpeg libavcodec-dev libavformat-dev libavutil-dev libswresample-dev libswscale-dev doxygen graphviz patchelf
          cmake --version
          ninja --version

      - name: Configure + build docs
        run: |
          command -v doxygen
          doxygen --version
          python scripts/configure.py ci --toolchain gcc --docs --no-tests --build-dir build/docs
          cmake --build build/docs --target doc-check

      - name: Upload artifact - docs
        uses: actions/upload-artifact@v4
        with:
          name: kanariv-docs
          path: |
            build/docs/docs/html
            build/docs/docs/xml
            build/docs/docs/doxygen-warnings.log
          if-no-files-found: error

  ffmpeg-trimmed-msvc:
    name: ffmpeg-trimmed (windows-latest / MSVC, decode-only whitelist)
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      KANARIV_TEST_NOAUDIO: 1
      KANARIV_TRIMMED_ROOT: ${{ github.workspace }}/ffmpeg-trimmed
      DEPS_REPO: "AhmedowM/deps-private"
      FFMPEG_VERSION: "8.1.2"
      REBUILD: "1"
      RELEASE_TAG: "ffmpeg-trimmed-8.1.2-2"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download trimmed archive from deps-private
        env:
          GH_TOKEN: ${{ secrets.DEPS_PAT }}
        run: |
          gh release download "${{ env.RELEASE_TAG }}" \
            --repo "${{ env.DEPS_REPO }}" \
            --pattern "ffmpeg-trimmed-${{ env.FFMPEG_VERSION }}-windows-x86_64.tar.gz" \
            --dir . \
            --clobber
        shell: bash

      - name: Extract trimmed archive
        run: |
          if command -v cygpath >/dev/null 2>&1; then
            troot="$(cygpath "$KANARIV_TRIMMED_ROOT")"
          else
            troot="$KANARIV_TRIMMED_ROOT"
          fi
          mkdir -p "$troot"
          tar -xzf ffmpeg-trimmed-${{ env.FFMPEG_VERSION }}-windows-x86_64.tar.gz -C "$troot"
          ls "$troot/bin"
        shell: bash

      - name: Configure (trimmed, fallback to default provider)
        id: pick
        # MSVC links the prebuilt tree (COFF import libs); it never builds
        # one (module FATALS without a complete FFmpeg_ROOT). Same fallback
        # contract as the other trim jobs.
        run: |
          if python scripts/configure.py ci --toolchain msvc --trimmed-ffmpeg --ffmpeg-root "$KANARIV_TRIMMED_ROOT" --build-dir build/ci-trimmed-msvc; then
            echo "build_dir=build/ci-trimmed-msvc" >> "$GITHUB_OUTPUT"
            echo "trimmed=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::trimmed FFmpeg unavailable -- falling back to default provider"
            python scripts/configure.py ci --toolchain msvc --build-dir build/ci-msvc
            echo "build_dir=build/ci-msvc" >> "$GITHUB_OUTPUT"
            echo "trimmed=false" >> "$GITHUB_OUTPUT"
          fi
        shell: bash

      - name: Stage DLLs beside test executables
        run: |
          # Same hermeticity rationale as the MinGW job; MSVC needs no
          # extra runtime DLLs (UCRT/vcruntime are system components).
          dest="${{ steps.pick.outputs.build_dir }}"
          troot="$(cygpath "$KANARIV_TRIMMED_ROOT")"
          if [ "${{ steps.pick.outputs.trimmed }}" = "true" ]; then
            src="$troot/bin"
          else
            src="$dest/_deps/ffmpeg_prebuilt-src/bin"
          fi
          for d in "$src"/avcodec-*.dll "$src"/avformat-*.dll "$src"/avutil-*.dll "$src"/swresample-*.dll; do
            test -f "$d" || (echo "missing $d" && exit 1)
            cp "$d" "$dest/"
          done
          ls "$dest/"*.dll
        shell: bash

      - name: Build
        run: |
          EXTRA=""
          if [ "${{ steps.pick.outputs.trimmed }}" = "true" ]; then EXTRA="--trimmed-ffmpeg --ffmpeg-root $KANARIV_TRIMMED_ROOT"; fi
          python scripts/configure.py ci --toolchain msvc --build-dir "${{ steps.pick.outputs.build_dir }}" $EXTRA --build
        shell: bash

      - name: Test
        env:
          KANARIV_TEST_NOAUDIO: 1
        run: |
          EXTRA=""
          if [ "${{ steps.pick.outputs.trimmed }}" = "true" ]; then EXTRA="--trimmed-ffmpeg --ffmpeg-root $KANARIV_TRIMMED_ROOT"; fi
          python scripts/configure.py ci --toolchain msvc --build-dir "${{ steps.pick.outputs.build_dir }}" $EXTRA --test
        shell: bash

  ffmpeg-trimmed-linux:
    name: ffmpeg-trimmed (ubuntu-24.04 / gcc-16, decode-only whitelist)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      KANARIV_TEST_NOAUDIO: 1
      KANARIV_TRIMMED_ROOT: ${{ github.workspace }}/ffmpeg-trimmed
      DEPS_REPO: "AhmedowM/deps-private"
      FFMPEG_VERSION: "8.1.2"
      REBUILD: "1"
      RELEASE_TAG: "ffmpeg-trimmed-8.1.2-2"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup GCC
        run: |
          sudo add-apt-repository ppa:ubuntu-toolchain-r/test -y
          sudo apt-get update
          sudo apt-get install -y gcc-16 g++-16
          sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-16 100 --slave /usr/bin/g++ g++ /usr/bin/g++-16 --slave /usr/bin/gcov gcov /usr/bin/gcov-16 || true
          gcc-16 --version; g++-16 --version

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build nasm pkg-config zlib1g-dev make curl libdbus-1-dev
          cmake --version
          ninja --version

      - name: Download trimmed archive from deps-private
        env:
          GH_TOKEN: ${{ secrets.DEPS_PAT }}
        run: |
          gh release download "${{ env.RELEASE_TAG }}" \
            --repo "${{ env.DEPS_REPO }}" \
            --pattern "ffmpeg-trimmed-${{ env.FFMPEG_VERSION }}-linux-x86_64.tar.gz" \
            --dir . \
            --clobber

      - name: Extract trimmed archive
        run: |
          mkdir -p "$KANARIV_TRIMMED_ROOT"
          tar -xzf ffmpeg-trimmed-${{ env.FFMPEG_VERSION }}-linux-x86_64.tar.gz -C "$KANARIV_TRIMMED_ROOT"
          ls "$KANARIV_TRIMMED_ROOT/lib"

      - name: Configure (trimmed, fallback to default provider)
        id: pick
        run: |
          if python scripts/configure.py ci --toolchain gcc --trimmed-ffmpeg --ffmpeg-root "$KANARIV_TRIMMED_ROOT" --build-dir build/ci-trimmed-gcc; then
            echo "build_dir=build/ci-trimmed-gcc" >> "$GITHUB_OUTPUT"
            echo "trimmed=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::trimmed FFmpeg unavailable -- falling back to default provider"
            python scripts/configure.py ci --toolchain gcc --build-dir build/ci-gcc
            echo "build_dir=build/ci-gcc" >> "$GITHUB_OUTPUT"
            echo "trimmed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build
        run: |
          EXTRA=""
          if [ "${{ steps.pick.outputs.trimmed }}" = "true" ]; then EXTRA="--trimmed-ffmpeg --ffmpeg-root $KANARIV_TRIMMED_ROOT"; fi
          python scripts/configure.py ci --toolchain gcc --build-dir "${{ steps.pick.outputs.build_dir }}" $EXTRA --build

      - name: Test
        env:
          KANARIV_TEST_NOAUDIO: 1
        run: |
          EXTRA=""
          if [ "${{ steps.pick.outputs.trimmed }}" = "true" ]; then EXTRA="--trimmed-ffmpeg --ffmpeg-root $KANARIV_TRIMMED_ROOT"; fi
          python scripts/configure.py ci --toolchain gcc --build-dir "${{ steps.pick.outputs.build_dir }}" $EXTRA --test

  ffmpeg-trimmed-macos:
    name: ffmpeg-trimmed (macos-latest / LLVM Clang, decode-only whitelist)
    runs-on: macos-latest
    timeout-minutes: 90
    env:
      KANARIV_TEST_NOAUDIO: 1
      KANARIV_TRIMMED_ROOT: ${{ github.workspace }}/ffmpeg-trimmed
      DEPS_REPO: "AhmedowM/deps-private"
      FFMPEG_VERSION: "8.1.2"
      REBUILD: "1"
      RELEASE_TAG: "ffmpeg-trimmed-8.1.2-2"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup LLVM Clang
        run: |
          brew update || echo "brew update failed, continuing with snapshot"
          brew install llvm || brew upgrade llvm
          LLVM_PREFIX="$(brew --prefix llvm)"
          echo "$LLVM_PREFIX/bin" >> $GITHUB_PATH
          "$LLVM_PREFIX/bin/clang" --version
          brew install ninja nasm pkg-config || brew upgrade ninja nasm pkg-config || true
          cmake --version
          ninja --version

      - name: Download trimmed archive from deps-private
        env:
          GH_TOKEN: ${{ secrets.DEPS_PAT }}
        run: |
          gh release download "${{ env.RELEASE_TAG }}" \
            --repo "${{ env.DEPS_REPO }}" \
            --pattern "ffmpeg-trimmed-${{ env.FFMPEG_VERSION }}-macos-arm64.tar.gz" \
            --dir . \
            --clobber

      - name: Extract trimmed archive
        run: |
          mkdir -p "$KANARIV_TRIMMED_ROOT"
          tar -xzf ffmpeg-trimmed-${{ env.FFMPEG_VERSION }}-macos-arm64.tar.gz -C "$KANARIV_TRIMMED_ROOT"
          ls "$KANARIV_TRIMMED_ROOT/lib"

      - name: Fix FFmpeg dylib install names (macOS)
        if: runner.os == 'macOS'
        run: |
          # The trimmed FFmpeg archive was built on the old `caudio` repo, where
          # the Actions workspace was /Users/runner/work/caudio/caudio/. Its
          # dylibs carry absolute install_name paths pointing there
          # (e.g. /Users/runner/work/caudio/caudio/ffmpeg-trimmed/lib/libavcodec.62.dylib),
          # which break after the rename to `kanariv` (workspace is now
          # /Users/runner/work/kanariv/kanariv/). Rewire each dylib's id and
          # cross-references to @rpath so build-tree test binaries resolve them
          # via rpath instead of a stale absolute path. Re-sign afterwards because
          # install_name_tool invalidates code signatures on macOS.
          set -euo pipefail
          libdir="$KANARIV_TRIMMED_ROOT/lib"
          for dylib in "$libdir"/libavcodec.*.dylib "$libdir"/libavformat.*.dylib \
                       "$libdir"/libavutil.*.dylib  "$libdir"/libswresample.*.dylib; do
            [ -f "$dylib" ] || continue
            name="$(basename "$dylib")"
            # SONAME: libavcodec.63.1.102.dylib -> libavcodec.63.dylib
            #         libavcodec.62.dylib   -> libavcodec.62.dylib  (single component)
            case "$name" in
              *.[0-9]*.[0-9]*.dylib)
                soname="${name%.[0-9]*.[0-9]*.dylib}.dylib"
                ;;
              *)
                soname="$name"
                ;;
            esac
            # 1) Rewire this dylib's own id to @rpath/<soname>
            install_name_tool -id "@rpath/$soname" "$dylib"
            # 2) Rewire every absolute FFmpeg cross-reference inside it to @rpath/<soname>
            otool -L "$dylib" | tail -n +2 | while IFS= read -r line; do
              old="$(echo "$line" | awk '{print $1}')"
              case "$old" in
                /*)
                  target="$(basename "$old")"
                  # Only rewire FFmpeg cross-references, never system dylibs
                  # (libSystem.B.dylib etc. resolve via the dyld fallback
                  # search path, not @rpath).
                  case "$target" in
                    libavcodec*|libavformat*|libavutil*|libswresample*)
                      case "$target" in
                        *.[0-9]*.[0-9]*.dylib)
                          tsoname="${target%.[0-9]*.[0-9]*.dylib}.dylib"
                          ;;
                        *)
                          tsoname="$target"
                          ;;
                      esac
                      install_name_tool -change "$old" "@rpath/$tsoname" "$dylib" || true
                      ;;
                  esac
                  ;;
              esac
            done
            # 3) Re-sign (install_name_tool invalidates the code signature)
            codesign --force -s - "$dylib" || true
          done

      - name: Configure (trimmed, fallback to default provider)
        id: pick
        run: |
          if python scripts/configure.py ci --toolchain clang --trimmed-ffmpeg --ffmpeg-root "$KANARIV_TRIMMED_ROOT" --build-dir build/ci-trimmed-clang; then
            echo "build_dir=build/ci-trimmed-clang" >> "$GITHUB_OUTPUT"
            echo "trimmed=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::trimmed FFmpeg unavailable -- falling back to default provider"
            python scripts/configure.py ci --toolchain clang --build-dir build/ci-clang
            echo "build_dir=build/ci-clang" >> "$GITHUB_OUTPUT"
            echo "trimmed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build
        run: |
          EXTRA=""
          if [ "${{ steps.pick.outputs.trimmed }}" = "true" ]; then EXTRA="--trimmed-ffmpeg --ffmpeg-root $KANARIV_TRIMMED_ROOT"; fi
          python scripts/configure.py ci --toolchain clang --build-dir "${{ steps.pick.outputs.build_dir }}" $EXTRA --build

      - name: Test
        env:
          KANARIV_TEST_NOAUDIO: 1
        run: |
          EXTRA=""
          if [ "${{ steps.pick.outputs.trimmed }}" = "true" ]; then EXTRA="--trimmed-ffmpeg --ffmpeg-root $KANARIV_TRIMMED_ROOT"; fi
          # On macOS, the trimmed FFmpeg dylibs live outside the build tree; make
          # sure dyld can find them at test/run time via DYLD_LIBRARY_PATH (the
          # dylibs' install_name was rewired to @rpath in a prior step, so
          # @rpath search + DYLD_LIBRARY_PATH together cover both build-tree and
          # rpath-lookup paths).
          if [ "${{ runner.os }}" = "macOS" ]; then export DYLD_LIBRARY_PATH="$KANARIV_TRIMMED_ROOT/lib"; fi
          python scripts/configure.py ci --toolchain clang --build-dir "${{ steps.pick.outputs.build_dir }}" $EXTRA --test

  sanitizers:
    name: sanitizers (ubuntu-24.04 / gcc-16)
    runs-on: ubuntu-latest
    env:
      KANARIV_TEST_NOAUDIO: 1
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup GCC
        run: |
          sudo add-apt-repository ppa:ubuntu-toolchain-r/test -y
          sudo apt-get update
          sudo apt-get install -y gcc-16 g++-16
          sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-16 100 --slave /usr/bin/g++ g++ /usr/bin/g++-16 --slave /usr/bin/gcov gcov /usr/bin/gcov-16 || true
          gcc-16 --version; g++-16 --version

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build ffmpeg libavcodec-dev libavformat-dev libavutil-dev libswresample-dev libswscale-dev patchelf pkg-config libdbus-1-dev
          ffmpeg -version || true
          cmake --version
          ninja --version

      - name: Configure (ASan+UBSan)
        env:
          CC: gcc-16
          CXX: g++-16
        run: >-
          python scripts/configure.py ci --toolchain gcc --sanitizers
          --define CMAKE_CATCH_DISCOVER_TESTS_DISCOVERY_MODE=PRE_TEST
          --build-dir build/ci-sanitizers

      - name: Build
        run: python scripts/configure.py ci --toolchain gcc --sanitizers --build-dir build/ci-sanitizers --build

      - name: Test
        env:
          KANARIV_TEST_NOAUDIO: 1
          # Known FFmpeg probe-buffer drip suppressed (see file); all other
          # leaks, UBSan and ASan reports stay fatal. NOTE: env blocks need
          # ${{ }} context syntax -- $VAR is NOT expanded here.
          LSAN_OPTIONS: suppressions=${{ github.workspace }}/tests/sanitizers/lsan.supp:report_objects=1
        run: >-
          python scripts/configure.py ci --toolchain gcc --sanitizers
          --define CMAKE_CATCH_DISCOVER_TESTS_DISCOVERY_MODE=PRE_TEST
          --build-dir build/ci-sanitizers --jobs 4 --test

  install-smoke:
    name: install-smoke (ubuntu-24.04 / gcc-16)
    runs-on: ubuntu-latest
    env:
      KANARIV_TEST_NOAUDIO: 1
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup GCC
        run: |
          sudo add-apt-repository ppa:ubuntu-toolchain-r/test -y
          sudo apt-get update
          sudo apt-get install -y gcc-16 g++-16
          sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-16 100 --slave /usr/bin/g++ g++ /usr/bin/g++-16 --slave /usr/bin/gcov gcov /usr/bin/gcov-16 || true
          gcc-16 --version; g++-16 --version

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build ffmpeg libavcodec-dev libavformat-dev libavutil-dev libswresample-dev libswscale-dev graphviz patchelf pkg-config libdbus-1-dev
          cmake --version
          ninja --version

      - name: Configure
        env:
          CC: gcc-16
          CXX: g++-16
        run: python scripts/configure.py ci --toolchain gcc --build-dir build/ci-gcc

      - name: Build
        run: python scripts/configure.py ci --toolchain gcc --build-dir build/ci-gcc --build

      - name: Test
        env:
          KANARIV_TEST_NOAUDIO: 1
        run: python scripts/configure.py ci --toolchain gcc --build-dir build/ci-gcc --test

      - name: Install to /tmp/kanariv-install
        run: cmake --install build/ci-gcc --prefix /tmp/kanariv-install

      - name: Verify install layout
        run: |
          echo "=== install tree ==="
          find /tmp/kanariv-install -type f | head -n 100
          echo "=== kanariv --version ==="
          /tmp/kanariv-install/bin/kanariv --version || build/ci-gcc/kanariv --version || echo "kanariv --version check failed"
          echo "=== version.hpp ==="
          test -f /tmp/kanariv-install/include/kanariv/version.hpp && echo "version.hpp found" || (echo "version.hpp missing" && exit 1)
          echo "=== no module sources in header-mode install ==="
          test ! -d /tmp/kanariv-install/include/kanariv/src && echo "no src/*.cppm (expected, modules OFF)" || (echo "unexpected src/*.cppm shipped" && exit 1)
          test -f /tmp/kanariv-install/lib/cmake/kanariv/kanarivConfig.cmake && echo "kanarivConfig.cmake found" || echo "kanarivConfig.cmake missing"
          test -f /tmp/kanariv-install/lib/cmake/kanariv/FindFFmpeg.cmake && echo "FindFFmpeg.cmake found" || (echo "FindFFmpeg.cmake missing" && exit 1)
          test -f /tmp/kanariv-install/include/kanariv/version_config.hpp && echo "version_config.hpp found" || (echo "version_config.hpp missing" && exit 1)

      - name: Smoke compile (find_package + headers)
        run: |
          mkdir -p /tmp/kanariv-smoke
          cat > /tmp/kanariv-smoke/CMakeLists.txt << 'EOF'
          cmake_minimum_required(VERSION 3.28)
          project(kanariv_smoke CXX)
          set(CMAKE_CXX_STANDARD 23)
          set(CMAKE_CXX_STANDARD_REQUIRED ON)
          list(APPEND CMAKE_PREFIX_PATH "/tmp/kanariv-install")
          find_package(kanariv CONFIG REQUIRED)
          add_executable(smoke main.cpp)
          target_link_libraries(smoke PRIVATE kanariv::utils)
          EOF
          cat > /tmp/kanariv-smoke/main.cpp << 'EOF'
          #include <kanariv/utils.hpp>
          #include <kanariv/version.hpp>
          #include <print>
          int main() {
            std::println("kanariv smoke ok: {}", kanariv::version::shortVersion());
            return 0;
          }
          EOF
          cmake -B /tmp/kanariv-smoke/build -G Ninja -DCMAKE_PREFIX_PATH=/tmp/kanariv-install -DCMAKE_CXX_STANDARD=23 /tmp/kanariv-smoke
          cmake --build /tmp/kanariv-smoke/build -v
          /tmp/kanariv-smoke/build/smoke || ./tmp/kanariv-smoke/build/smoke

  modules-smoke:
    name: modules-smoke (ubuntu-24.04 / gcc-16)
    runs-on: ubuntu-latest
    env:
      KANARIV_TEST_NOAUDIO: 1
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup GCC
        run: |
          sudo add-apt-repository ppa:ubuntu-toolchain-r/test -y
          sudo apt-get update
          sudo apt-get install -y gcc-16 g++-16
          sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-16 100 --slave /usr/bin/g++ g++ /usr/bin/g++-16 --slave /usr/bin/gcov gcov /usr/bin/gcov-16 || true
          gcc-16 --version; g++-16 --version

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build ffmpeg libavcodec-dev libavformat-dev libavutil-dev libswresample-dev libswscale-dev patchelf pkg-config libdbus-1-dev
          cmake --version
          ninja --version

      - name: Configure (modules ON)
        env:
          CC: gcc-16
          CXX: g++-16
        run: python scripts/configure.py modules --toolchain gcc --build-dir build/modules-gcc

      - name: Build
        run: python scripts/configure.py modules --toolchain gcc --build-dir build/modules-gcc --build

      - name: Install to /tmp/kanariv-install-mod
        run: cmake --install build/modules-gcc --prefix /tmp/kanariv-install-mod

      - name: Verify module sources shipped
        run: |
          test -f /tmp/kanariv-install-mod/modules/kanariv.cppm && echo "kanariv.cppm found" || (echo "kanariv.cppm missing" && exit 1)
          ls /tmp/kanariv-install-mod/modules/*/*.cppm /tmp/kanariv-install-mod/modules/*/*/*.cppm | head -n 20

      - name: Smoke compile (find_package + import kanariv.utils)
        run: |
          mkdir -p /tmp/kanariv-mod-smoke
          # Correct consumption: link kanariv::utils (which carries its own
          # installed CXX_MODULES file set) and import the module. Do NOT list
          # the installed .cppm files in our own FILE_SET -- that compiles the
          # same module names twice and CMake aborts with "Disagreement of the
          # location of the 'kanariv.utils' module".
          cat > /tmp/kanariv-mod-smoke/CMakeLists.txt << 'EOF'
          cmake_minimum_required(VERSION 3.28)
          project(kanariv_mod_smoke CXX)
          set(CMAKE_CXX_STANDARD 23)
          set(CMAKE_CXX_STANDARD_REQUIRED ON)
          set(CMAKE_CXX_SCAN_FOR_MODULES ON)
          list(APPEND CMAKE_PREFIX_PATH "/tmp/kanariv-install-mod")
          find_package(kanariv CONFIG REQUIRED)
          add_executable(smoke main.cpp)
          target_compile_features(smoke PRIVATE cxx_std_23)
          target_link_libraries(smoke PRIVATE kanariv::utils)
          EOF
          cat > /tmp/kanariv-mod-smoke/main.cpp << 'EOF'
          #include <print>
          import kanariv.version;
          int main() {
            std::println("kanariv module smoke ok: {}", kanariv::version::shortVersion());
            return 0;
          }
          EOF
          cmake -B /tmp/kanariv-mod-smoke/build -G Ninja -DCMAKE_PREFIX_PATH=/tmp/kanariv-install-mod -DCMAKE_CXX_STANDARD=23 /tmp/kanariv-mod-smoke
          cmake --build /tmp/kanariv-mod-smoke/build -v
          /tmp/kanariv-mod-smoke/build/smoke
