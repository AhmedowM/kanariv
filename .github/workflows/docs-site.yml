name: Deploy docs to GitHub Pages

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The API reference is generated from Doxygen XML, so the docs job needs a
      # configured build tree even though it never compiles the project.
      - name: Install docs toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build doxygen graphviz \
            ffmpeg libavcodec-dev libavformat-dev libavutil-dev \
            libswresample-dev libswscale-dev
          cmake --version
          doxygen --version

      - name: Generate Doxygen XML
        run: |
          cmake -S . -B build/docs -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DKANARIV_BUILD_DOCS=ON \
            -DKANARIV_BUILD_CLI=OFF \
            -DKANARIV_ENABLE_TESTS=OFF \
            -DKANARIV_ENABLE_EXAMPLES=OFF
          cmake --build build/docs --target doc-check

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: docs-site/package-lock.json

      - name: Install dependencies
        working-directory: ./docs-site
        run: npm ci

      - name: Build site
        working-directory: ./docs-site
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./docs-site/dist

  deploy:
    # Pull requests only build the site; publishing happens from master.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
