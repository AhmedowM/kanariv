plugins {
    id 'com.android.application'
}

android {
    namespace 'com.kanariv.app'
    compileSdk 36
    buildToolsVersion "36.0.0"

    defaultConfig {
        applicationId "com.kanariv.app"
        minSdk 24
        targetSdk 36
        versionCode 1
        versionName "1.0"

        externalNativeBuild {
            cmake {
                cppFlags "-std=c++23 -Wall -Wextra -Werror"
                arguments "-DANDROID_PLATFORM=android-24",
                          "-DANDROID_STL=c++_shared"
            }
        }

        ndk {
            // Only the arm64-v8a prebuilt component libraries exist under
            // build/android-arm64, so package that ABI alone for now.
            abiFilters 'arm64-v8a'
        }
        ndkVersion "30.0.16248370"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    packagingOptions {
        jniLibs {
            // The combined library duplicates the service/media-session
            // classes already present in the component libraries. Nothing
            // loads it, and packaging it risks shadowed symbols.
            excludes += ['lib/arm64-v8a/libkanariv.so']
        }
    }
}

dependencies {
    // No external dependencies -- using Android framework classes only
    // to avoid downloading artifacts not present in the local SDK cache.
}
